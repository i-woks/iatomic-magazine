name = "iatomic-api"
main = "src/index.ts"
compatibility_date = "2024-05-12"
compatibility_flags = ["nodejs_compat"]

account_id = "0be31dbd903c8a7832f2058036b05221"

[vars]
API_BASE_PATH = "/api"
AI_PROVIDER = "deepseek"
AI_MODEL = "deepseek-chat"
AI_API_BASE_URL = "https://api.deepseek.com"
ADMIN_BASE_PATH = "/control/iatomic-panel"
# PUBLIC_MEDIA_BASE_URL = "https://pub-xxx.r2.dev"  # Uncomment after setting up public R2 domain

# Secrets (already set via wrangler secret put):
# AI_API_KEY, N8N_MCP_SERVER_URL, ADMIN_EMAIL, ADMIN_INITIAL_PASSWORD
# ADMIN_SESSION_SECRET, SETUP_SECRET, CRON_SECRET

[[d1_databases]]
binding = "DB"
database_name = "iatomic-db"
database_id = "df091f99-f96c-4a52-9e05-355eab604d1b"

# R2 media storage — REQUIRES R2 to be activated in Cloudflare Dashboard first:
# https://dash.cloudflare.com → R2 Object Storage → Enable
# Then run: wrangler r2 bucket create iatomic-media
# Then uncomment the lines below and redeploy.
# [[r2_buckets]]
# binding = "MEDIA_BUCKET"
# bucket_name = "iatomic-media"

[[kv_namespaces]]
binding = "CACHE"
id = "edfb0874d80a45a8879f7fdb6775777f"

[triggers]
crons = ["0 9 * * *"]

[env.production]
name = "iatomic-api"

[[env.production.d1_databases]]
binding = "DB"
database_name = "iatomic-db"
database_id = "df091f99-f96c-4a52-9e05-355eab604d1b"

# [[env.production.r2_buckets]]
# binding = "MEDIA_BUCKET"
# bucket_name = "iatomic-media"

[[env.production.kv_namespaces]]
binding = "CACHE"
id = "edfb0874d80a45a8879f7fdb6775777f"

[env.production.triggers]
crons = ["0 9 * * *"]
